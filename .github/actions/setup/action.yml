name: Set up sope
description: Install the pinned toolchain and locked Bun dependencies.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version: '1.27.1'
        cache: false # The Go SDK currently has no external modules/go.sum.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: '1.3.11'
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.3.11-${{ hashFiles('bun.lock') }}
    - name: Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends clang libcurl4-openssl-dev pkg-config
    - name: Locked dependencies
      shell: bash
      run: bun install --frozen-lockfile
